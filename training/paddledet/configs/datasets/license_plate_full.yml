# Full 22,906-image training set (used for retraining runs).
# Paths are relative to the working directory training/paddledet/.
metric: COCO

num_classes: 1

TrainDataset:
  name: COCODataSet
  image_dir: images
  anno_path: train.json
  dataset_dir: ../../data/original
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet
  image_dir: images
  anno_path: val.json
  dataset_dir: ../../data/original

TestDataset:
  name: ImageFolder
  anno_path: val.json
  dataset_dir: ../../data/original
