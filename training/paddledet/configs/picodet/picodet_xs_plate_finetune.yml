# Fine-tune the current model on the mixed dataset at a low learning rate (used by the SageMaker training job).
_BASE_: [
  '../datasets/license_plate_finetune.yml',
  '../runtime.yml',
  '_base_/picodet_v2.yml',
  '_base_/optimizer_300e.yml',
  '_base_/picodet_416_reader.yml',
]

pretrain_weights: ../../models/v1/checkpoint/model_final
weights: output/picodet_xs_plate_finetune/model_final
find_unused_parameters: True
use_ema: true
epoch: 10
snapshot_epoch: 10
worker_num: 4

LCNet:
  scale: 0.35
  feature_maps: [3, 4, 5]

LCPAN:
  out_channels: 96

PicoHeadV2:
  conv_feat:
    name: PicoFeat
    feat_in: 96
    feat_out: 96
    num_convs: 2
    num_fpn_stride: 4
    norm_type: bn
    share_cls_reg: True
    use_se: True
  feat_in_chan: 96

TrainReader:
  batch_size: 16

LearningRate:
  base_lr: 0.02
  schedulers:
  - name: CosineDecay
    max_epochs: 10
  - name: LinearWarmup
    start_factor: 0.1
    steps: 50
